server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml,font/woff2
    min-response-size: 1024

spring:
  application:
    name: ifs25050-p5-pbo2026-springboot-cashflow
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pbo2026_cashflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  web:
    resources:
      cache:
        cachecontrol:
          max-age: 31536000
          cache-public: true
          immutable: true

vaadin:
  launch-browser: false

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  admin:
    name: ${ROOT_ADMIN_NAME:Administrator}
    email: ${ROOT_ADMIN_EMAIL:admin@delcom.org}
    password: ${ROOT_ADMIN_PASSWORD:admin123}